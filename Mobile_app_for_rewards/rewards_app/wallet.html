<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Customer Wallet - Rewards Points collection for customers</title>
  <link rel="stylesheet" href="css/wireframe.css">
</head>
<body>
  <div class="mobile-device-shell">
    <header class="mobile-status-bar">
      <span>9:41</span>
      <div class="notch-pill"></div>
      <span class="header-pill">WALLET</span>
    </header>

    <div class="mobile-header">
      <div class="wallet-header-info">
        <div class="wallet-user-row">
          <strong id="customerName" class="wallet-user-name">Rahul Sharma</strong>
          <span class="user-balance-pill wallet-user-badge">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            Verified
          </span>
        </div>
        <small id="customerPhone" class="wallet-user-phone">+91 9876543210</small>
      </div>
      <button class="header-btn" id="btnLogout">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Exit
      </button>
    </div>

    <main class="mobile-viewport">
      <!-- Hero Points Balance Box -->
      <div class="wallet-hero-box">
        <span class="wf-label mb-0">Total Available Reward Points</span>
        <div class="wallet-hero-points" id="totalPoints">0</div>
        <div class="wallet-pills-row">
          <span class="header-pill pill-active" id="activeCount">0 Active</span>
          <span class="header-pill pill-expired" id="expiredCount">0 Expired</span>
        </div>

        <!-- Redemption Policy with Nearest Expiring Points -->
        <div class="policy-strip policy-strip-wallet" id="cappingSummary">
          Loading rewards &amp; redemption policy...
        </div>
      </div>

      <!-- Segmented View Switcher: Gained vs Applied Lists -->
      <div class="wallet-segment-bar">
        <button type="button" class="wallet-segment-btn active" id="tabGainedRewards">
          Gained Rewards (<span id="gainedCountBadge">0</span>)
        </button>
        <button type="button" class="wallet-segment-btn" id="tabAppliedRewards">
          Applied on Products (<span id="appliedCountBadge">0</span>)
        </button>
      </div>

      <!-- LIST SCREEN 1: GAINED REWARDS (Collapsible View with Points & Expiry) -->
      <section id="viewGainedRewards" class="wallet-view-section">
        <div id="rewardsListContainer"></div>
        <div id="emptyGainedState" class="wf-card dashed empty-wallet-card u-hidden">
          <strong class="wf-title-sm">No Rewards in Wallet</strong>
          <p class="wf-meta wf-meta-spaced">Earned rewards from orders will appear here.</p>
        </div>
      </section>

      <!-- LIST SCREEN 2: APPLIED REWARDS ON PRODUCTS (Separate View) -->
      <section id="viewAppliedRewards" class="wallet-view-section u-hidden">
        <div class="wf-card-header card-header-spaced">
          <span class="wf-title-sm">Applied Rewards on Products</span>
        </div>
        <div id="appliedRewardsListContainer"></div>
        <div id="emptyAppliedState" class="wf-card dashed empty-wallet-card u-hidden">
          <strong class="wf-title-sm">No Applied Rewards Yet</strong>
        </div>
      </section>
    </main>

    <nav class="mobile-bottom-nav">
      <a href="wallet.html" class="nav-tab-item active">
        <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span>
        <span>My Wallet</span>
      </a>
      <a href="login.html" class="nav-tab-item">
        <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span>Sign In</span>
      </a>
      <a href="register.html" class="nav-tab-item">
        <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg></span>
        <span>Register</span>
      </a>
    </nav>
  </div>

  <script src="js/db.js"></script>
  <script src="js/wallet.js"></script>
</body>
</html>
