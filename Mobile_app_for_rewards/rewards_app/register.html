<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Customer Register - Rewards Points collection for customers</title>
  <link rel="stylesheet" href="css/wireframe.css">
</head>
<body>
  <!-- Mobile Prototype Device Shell -->
  <div class="mobile-device-shell">
    
    <!-- Status Bar -->
    <header class="mobile-status-bar">
      <span>9:41</span>
      <div class="notch-pill"></div>
      <span class="header-pill">JOIN</span>
    </header>

    <!-- Top Action Bar -->
    <div class="mobile-header">
      <a href="login.html" class="header-btn">&larr; Sign In</a>
      <span class="header-title">Create Account</span>
      <a href="wallet.html" class="header-btn">Wallet</a>
    </div>

    <!-- Toast Notification -->
    <div class="wf-toast" id="notification"></div>

    <!-- Scrollable Screen Content Viewport -->
    <main class="mobile-viewport">
      <div class="wf-card highlight" style="text-align: center; padding: 16px 12px; margin-bottom: 12px;">
        <span class="wf-title-sm" style="display: block; margin-bottom: 4px;">Join Customer Rewards</span>
        <p class="wf-meta">Register your phone number to earn and track reward points on your orders.</p>
      </div>

      <form id="registerForm">
        <div class="wf-card">
          <div class="wf-form-group">
            <label class="wf-label" for="regName">Full Customer Name *</label>
            <input type="text" id="regName" name="name" autocomplete="name" class="wf-input" placeholder="e.g. Rahul Sharma" required>
          </div>

          <div class="wf-form-group">
            <label class="wf-label" for="regPhone">Mobile Phone (10 digits) *</label>
            <input type="tel" id="regPhone" name="phone" inputmode="numeric" class="wf-input" placeholder="e.g. 9876543210" required>
            <small class="wf-meta">Your rewards points wallet is attached to this phone number</small>
          </div>

          <div class="wf-form-group" style="margin-bottom: 0;">
            <label class="wf-label" for="regPassword">Set Password *</label>
            <input type="password" id="regPassword" name="password" autocomplete="new-password" class="wf-input" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" id="btnRegister" class="wf-btn" style="margin-bottom: 12px;">
          Complete Registration
        </button>
      </form>

      <div class="wf-card dashed" style="text-align: center;">
        <span class="wf-title-sm" style="font-size: 0.78rem; display: block; margin-bottom: 4px;">Already Registered?</span>
        <a href="login.html" class="wf-btn wf-btn-secondary wf-btn-sm" style="display: inline-block;">Sign In Here</a>
      </div>
    </main>

    <!-- Customer Bottom Tab Navigation -->
    <nav class="mobile-bottom-nav">
      <a href="wallet.html" class="nav-tab-item">
        <span class="tab-icon">&#128157;</span>
        <span>My Wallet</span>
      </a>
      <a href="login.html" class="nav-tab-item">
        <span class="tab-icon">&#128100;</span>
        <span>Sign In</span>
      </a>
      <a href="register.html" class="nav-tab-item active">
        <span class="tab-icon">&#128221;</span>
        <span>Register</span>
      </a>
    </nav>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
